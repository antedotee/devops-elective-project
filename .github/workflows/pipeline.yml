# Single Docker image: Express serves API + SPA. ECS uses IAM role LabRole (Terraform data source).

# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION

# Terraform remote state — S3 only. CI uses a fixed bucket name per repo (no Actions Variables):
#   Bucket: shopsmart-tf-<github.repository_id>
#   Key:    shopsmart/terraform.tfstate
# If head-bucket fails, CI runs create-bucket + versioning + public-access block (requires s3:CreateBucket on your role).

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Prepare report directories
        run: mkdir -p server/reports client/reports server/public

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests (JUnit report)
        working-directory: server
        run: npm test

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client unit and integration tests (Vitest JSON report)
        working-directory: client
        run: npm run test

      - name: Upload test reports (Phase 1 artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          retention-days: 30
          if-no-files-found: warn
          path: |
            server/reports/
            client/reports/

  terraform:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET_NAME: shopsmart-tf-${{ github.repository_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Ensure Terraform state S3 bucket exists
        run: |
          set -euo pipefail
          echo "State bucket: ${TF_STATE_BUCKET_NAME}"
          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET_NAME}" 2>/dev/null; then
            echo "Bucket already exists."
          else
            echo "Creating bucket..."
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET_NAME}" --region "${AWS_REGION}"
            else
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET_NAME}" --region "${AWS_REGION}" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
            aws s3api put-public-access-block \
              --bucket "${TF_STATE_BUCKET_NAME}" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-versioning \
              --bucket "${TF_STATE_BUCKET_NAME}" \
              --versioning-configuration Status=Enabled
          fi

      - name: Terraform Init (S3 backend)
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

  deploy:
    name: Push monolith image and apply Terraform
    needs: [test, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_STATE_BUCKET_NAME: shopsmart-tf-${{ github.repository_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Format Check (deploy)
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Ensure Terraform state S3 bucket exists
        run: |
          set -euo pipefail
          echo "State bucket: ${TF_STATE_BUCKET_NAME}"
          if aws s3api head-bucket --bucket "${TF_STATE_BUCKET_NAME}" 2>/dev/null; then
            echo "State bucket OK"
          else
            echo "Creating bucket..."
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET_NAME}" --region "${AWS_REGION}"
            else
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET_NAME}" --region "${AWS_REGION}" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
            aws s3api put-public-access-block \
              --bucket "${TF_STATE_BUCKET_NAME}" \
              --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            aws s3api put-bucket-versioning \
              --bucket "${TF_STATE_BUCKET_NAME}" \
              --versioning-configuration Status=Enabled
          fi

      - name: Terraform Init (S3 backend)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="key=shopsmart/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply (ECR + S3 only, first)
        run: |
          set -euo pipefail
          terraform apply -auto-approve \
            -target=random_id.bucket_suffix \
            -target=aws_s3_bucket.app_bucket \
            -target=aws_s3_bucket_versioning.app_bucket_versioning \
            -target=aws_s3_bucket_server_side_encryption_configuration.app_bucket_encryption \
            -target=aws_s3_bucket_public_access_block.app_bucket_public_access_block \
            -target=aws_ecr_repository.app

      - name: ECR repository URL for Docker tags
        id: ecr_repo
        run: echo "repo_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr_repo.outputs.repo_url }}:${{ github.sha }}
            ${{ steps.ecr_repo.outputs.repo_url }}:latest

      - name: Import existing named infrastructure into Terraform state
        run: |
          set -euo pipefail

          state_has() {
            terraform state list | grep -q "^$1$"
          }

          import_if_present() {
            local address="$1"
            local id="${2:-}"
            if [ -n "${id}" ] && [ "${id}" != "None" ] && [ "${id}" != "null" ]; then
              terraform import "${address}" "${id}"
            fi
          }

          DEFAULT_VPC_ID="$(aws ec2 describe-vpcs \
            --filters Name=isDefault,Values=true \
            --query 'Vpcs[0].VpcId' \
            --output text)"

          if ! state_has 'aws_ecr_repository\.app'; then
            ECR_NAME="$(aws ecr describe-repositories \
              --repository-names "shopsmart-repo" \
              --query 'repositories[0].repositoryName' \
              --output text 2>/dev/null || true)"
            import_if_present aws_ecr_repository.app "${ECR_NAME}"
          fi

          if ! state_has 'aws_ecs_cluster\.main'; then
            CLUSTER_NAME="$(aws ecs describe-clusters \
              --clusters "shopsmart-cluster" \
              --query 'clusters[0].clusterName' \
              --output text 2>/dev/null || true)"
            import_if_present aws_ecs_cluster.main "${CLUSTER_NAME}"
          fi

          if ! state_has 'aws_security_group\.ecs_sg'; then
            ECS_SG_ID="$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values="${DEFAULT_VPC_ID}" Name=group-name,Values="shopsmart-ecs-sg" \
              --query 'SecurityGroups[0].GroupId' \
              --output text 2>/dev/null || true)"
            import_if_present aws_security_group.ecs_sg "${ECS_SG_ID}"
          fi

          if ! state_has 'aws_lb\.main'; then
            LB_ARN="$(aws elbv2 describe-load-balancers \
              --names "shopsmart-alb" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null || true)"
            import_if_present aws_lb.main "${LB_ARN}"
          fi

          if ! state_has 'aws_security_group\.alb'; then
            LB_ARN="$(aws elbv2 describe-load-balancers \
              --names "shopsmart-alb" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null || true)"
            if [ -n "${LB_ARN}" ] && [ "${LB_ARN}" != "None" ] && [ "${LB_ARN}" != "null" ]; then
              ALB_SG_ID="$(aws elbv2 describe-load-balancers \
                --load-balancer-arns "${LB_ARN}" \
                --query 'LoadBalancers[0].SecurityGroups[0]' \
                --output text 2>/dev/null || true)"
              import_if_present aws_security_group.alb "${ALB_SG_ID}"
            fi
          fi

          if ! state_has 'aws_lb_target_group\.app'; then
            LB_ARN="$(aws elbv2 describe-load-balancers \
              --names "shopsmart-alb" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null || true)"
            if [ -n "${LB_ARN}" ] && [ "${LB_ARN}" != "None" ] && [ "${LB_ARN}" != "null" ]; then
              TG_ARN="$(aws elbv2 describe-listeners \
                --load-balancer-arn "${LB_ARN}" \
                --query 'Listeners[?Port==`80`][0].DefaultActions[0].TargetGroupArn' \
                --output text 2>/dev/null || true)"
              import_if_present aws_lb_target_group.app "${TG_ARN}"
            fi
          fi

          if ! state_has 'aws_lb_listener\.http'; then
            LB_ARN="$(aws elbv2 describe-load-balancers \
              --names "shopsmart-alb" \
              --query 'LoadBalancers[0].LoadBalancerArn' \
              --output text 2>/dev/null || true)"
            if [ -n "${LB_ARN}" ] && [ "${LB_ARN}" != "None" ] && [ "${LB_ARN}" != "null" ]; then
              LISTENER_ARN="$(aws elbv2 describe-listeners \
                --load-balancer-arn "${LB_ARN}" \
                --query 'Listeners[?Port==`80`][0].ListenerArn' \
                --output text 2>/dev/null || true)"
              import_if_present aws_lb_listener.http "${LISTENER_ARN}"
            fi
          fi

          if ! state_has 'aws_db_subnet_group\.main'; then
            DB_SUBNET_GROUP_NAME="$(aws rds describe-db-instances \
              --db-instance-identifier "shopsmart-pg" \
              --query 'DBInstances[0].DBSubnetGroup.DBSubnetGroupName' \
              --output text 2>/dev/null || true)"
            import_if_present aws_db_subnet_group.main "${DB_SUBNET_GROUP_NAME}"
          fi

          if ! state_has 'aws_security_group\.rds'; then
            RDS_SG_ID="$(aws rds describe-db-instances \
              --db-instance-identifier "shopsmart-pg" \
              --query 'DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId' \
              --output text 2>/dev/null || true)"
            import_if_present aws_security_group.rds "${RDS_SG_ID}"
          fi

          if ! state_has 'aws_db_instance\.postgres'; then
            DB_ID="$(aws rds describe-db-instances \
              --db-instance-identifier "shopsmart-pg" \
              --query 'DBInstances[0].DBInstanceIdentifier' \
              --output text 2>/dev/null || true)"
            import_if_present aws_db_instance.postgres "${DB_ID}"
          fi

      - name: Terraform apply (full stack, image tag from commit)
        run: terraform apply -auto-approve

      - name: Run DB migration and seed task in ECS
        run: |
          set -euo pipefail
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          SERVICE="$(terraform output -raw ecs_service_name)"
          TASK_DEF="$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].taskDefinition' \
            --output text)"
          SUBNETS="$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.subnets' \
            --output text | tr '\t' ',')"
          SECURITY_GROUPS="$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.securityGroups' \
            --output text | tr '\t' ',')"
          ASSIGN_PUBLIC_IP="$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp' \
            --output text)"

          MIGRATION_TASK_ARN="$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${TASK_DEF}" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUPS}],assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --overrides '{"containerOverrides":[{"name":"shopsmart","command":["node","src/db/runMigrate.js"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"

          aws ecs wait tasks-stopped --cluster "${CLUSTER}" --tasks "${MIGRATION_TASK_ARN}"

          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${MIGRATION_TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          if [ "${EXIT_CODE}" != "0" ]; then
            aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks "${MIGRATION_TASK_ARN}" \
              --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json || true
            echo "Migration task failed with exit code ${EXIT_CODE}"
            exit 1
          fi

      - name: Wait for ECS service stable
        run: |
          set -euo pipefail
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          if aws ecs wait services-stable --cluster "${CLUSTER}" --services "${SERVICE}"; then
            exit 0
          fi

          echo "ECS service did not reach stable state. Collecting diagnostics..."

          aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].events[0:15].[createdAt,message]' \
            --output table || true

          TASK_ARNS="$(aws ecs list-tasks \
            --cluster "${CLUSTER}" \
            --service-name "${SERVICE}" \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text || true)"
          STOPPED_TASK_ARNS="$(aws ecs list-tasks \
            --cluster "${CLUSTER}" \
            --service-name "${SERVICE}" \
            --desired-status STOPPED \
            --query 'taskArns[0:10]' \
            --output text || true)"

          if [ -n "${TASK_ARNS}" ] || [ -n "${STOPPED_TASK_ARNS}" ]; then
            aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks ${TASK_ARNS} ${STOPPED_TASK_ARNS} \
              --query 'tasks[].{taskArn:taskArn,lastStatus:lastStatus,desiredStatus:desiredStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,healthStatus:healthStatus}}' \
              --output json || true
          fi

          TARGET_GROUP_ARN="$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text || true)"
          if [ -n "${TARGET_GROUP_ARN}" ] && [ "${TARGET_GROUP_ARN}" != "None" ]; then
            aws elbv2 describe-target-health \
              --target-group-arn "${TARGET_GROUP_ARN}" \
              --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
              --output table || true
          fi

          LOG_GROUP="/ecs/shopsmart-task"
          LOG_STREAMS="$(aws logs describe-log-streams \
            --log-group-name "${LOG_GROUP}" \
            --order-by LastEventTime \
            --descending \
            --max-items 5 \
            --query 'logStreams[].logStreamName' \
            --output text 2>/dev/null || true)"
          for STREAM in ${LOG_STREAMS}; do
            echo "Recent logs from ${STREAM}:"
            aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${STREAM}" \
              --limit 50 \
              --query 'events[].message' \
              --output text || true
          done

          exit 1
